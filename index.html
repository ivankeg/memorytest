<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lern-Memory</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-back-bg: #1e293b;
      --card-term-bg: #1e3a8a;
      --card-def-bg: #064e3b;
      --accent: #38bdf8;
      --matched-border: #22c55e;
      --mismatch-border: #ef4444;
      --text: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 12px;
    }

    header {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .stats {
      font-size: 1.1rem;
      font-weight: bold;
    }

    .btn {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .btn:active {
      opacity: 0.8;
    }

    /* 4x4 Gitter */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-gap: 8px;
      width: 100%;
      max-width: 420px;
      aspect-ratio: 1 / 1;
    }

    /* Karten-Grundgerüst */
    .card {
      width: 100%;
      height: 100%;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 6px;
      font-size: 0.78rem;
      line-height: 1.2;
      word-break: break-word;
      hyphens: auto;
      border: 2px solid transparent;
      transition: background-color 0.2s, border-color 0.2s;
    }

    /* Status 1: Verdeckt */
    .card.hidden {
      background-color: var(--card-back-bg);
      border-color: #334155;
      color: var(--accent);
      font-size: 1.4rem;
      font-weight: bold;
    }

    /* Status 2: Aufgedeckt (Begriff) */
    .card.revealed.type-term,
    .preview-card.type-term {
      background-color: var(--card-term-bg);
      border-color: var(--accent);
      font-weight: 700;
    }

    /* Status 2: Aufgedeckt (Definition) */
    .card.revealed.type-def,
    .preview-card.type-def {
      background-color: var(--card-def-bg);
      border-color: var(--accent);
    }

    .card.revealed.type-term { font-size: 0.8rem; }
    .card.revealed.type-def { font-size: 0.65rem; }

    /* Status 3: Falsches Paar */
    .card.mismatch {
      border-color: var(--mismatch-border) !important;
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.4);
    }

    /* Status 4: Gefundenes Paar */
    .card.matched {
      border-color: var(--matched-border) !important;
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.4);
      cursor: pointer;
    }

    /* Modals */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 100;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      background: var(--card-back-bg);
      padding: 24px;
      border-radius: 12px;
      border: 1px solid #475569;
      text-align: center;
      max-width: 320px;
      width: 100%;
    }

    .modal h2 { margin-bottom: 12px; color: var(--accent); }
    .modal p { margin-bottom: 20px; color: #cbd5e1; }
